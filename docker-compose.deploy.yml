services:
  app:
    image: ${BACKEND_IMAGE:-confidehub/bodaconnect-app}:${BACKEND_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_HOST: mqtt-broker
      MQTT_PORT: 1883
      MQTT_TOPIC_RIDE_STATUS: ${MQTT_TOPIC_RIDE_STATUS:-ride/status}
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped

  scheduler:
    image: ${BACKEND_IMAGE:-confidehub/bodaconnect-app}:${BACKEND_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
    entrypoint: ["php", "artisan", "schedule:work"]
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-confidehub/bodaconnect-frontend}:${FRONTEND_TAG:-latest}
    depends_on:
      app:
        condition: service_started
      scheduler:
        condition: service_started
      mqtt-broker:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bodaconnect
      MYSQL_USER: bodaconnect
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/api/status >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  metricbeat:
    image: docker.elastic.co/beats/metricbeat:8.14.3
    user: root
    depends_on:
      app:
        condition: service_started
      scheduler:
        condition: service_started
      frontend:
        condition: service_started
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    command: ["--strict.perms=false"]
    environment:
      BODACONNECT_APP_CONTAINER_NAME: ${COMPOSE_PROJECT_NAME:-bodaconnect}-app-1
      BODACONNECT_FRONTEND_CONTAINER_NAME: ${COMPOSE_PROJECT_NAME:-bodaconnect}-frontend-1
      BODACONNECT_DB_CONTAINER_NAME: ${COMPOSE_PROJECT_NAME:-bodaconnect}-db-1
      MYSQL_MONITORING_DSN: "root:rootsecret@tcp(db:3306)/"
    volumes:
      - ./monitoring/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      - /:/hostfs:ro
    restart: unless-stopped

  mqtt-broker:
    image: eclipse-mosquitto:2
    expose:
      - "1883"
      - "9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

volumes:
  mysql_data:
    name: ${MYSQL_DATA_VOLUME:-${DATA_VOLUME_PREFIX:-bodaconnect}-mysql-data}
  elasticsearch_data:
    name: ${ELASTICSEARCH_DATA_VOLUME:-${DATA_VOLUME_PREFIX:-bodaconnect}-elasticsearch-data}
