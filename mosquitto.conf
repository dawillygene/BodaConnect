# ── Listeners ────────────────────────────────────────────────
listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

# ── Persistence ──────────────────────────────────────────────
persistence false

# ── Logging ──────────────────────────────────────────────────
# Log to stdout so Docker captures every MQTT event.
# View with: docker compose logs -f mqtt-broker
log_dest stdout

# 'all' covers: debug, error, warning, notice, information, subscribe, unsubscribe
log_type all

# Prepend ISO-8601 timestamp to every log line
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Log every connect / disconnect message
connection_messages true
