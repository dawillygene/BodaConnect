services:
  app:
    build:
      context: .
      target: app
    container_name: bodaconnect-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: bodaconnect
      DB_PASSWORD: secret
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: bodaconnect-frontend
    depends_on:
      app:
        condition: service_started
    ports:
      - "3000:80"
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: bodaconnect-db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: bodaconnect
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: bodaconnect-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: bodaconnect-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/api/status >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  metricbeat:
    image: docker.elastic.co/beats/metricbeat:8.14.3
    container_name: bodaconnect-metricbeat
    user: root
    depends_on:
      app:
        condition: service_started
      frontend:
        condition: service_started
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    command: ["--strict.perms=false"]
    environment:
      BODACONNECT_APP_CONTAINER_NAME: bodaconnect-app
      BODACONNECT_FRONTEND_CONTAINER_NAME: bodaconnect-frontend
      BODACONNECT_DB_CONTAINER_NAME: bodaconnect-db
      MYSQL_MONITORING_DSN: "root:rootsecret@tcp(db:3306)/"
    volumes:
      - ./monitoring/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      - /:/hostfs:ro
    restart: unless-stopped

volumes:
  mysql_data:
  elasticsearch_data:
