services:
  app:
    build:
      context: .
      target: app
    container_name: bodaconnect-app
    depends_on:
      db:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: bodaconnect
      DB_PASSWORD: secret
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_HOST: mqtt-broker
      MQTT_PORT: 1883
      MQTT_TOPIC_RIDE_STATUS: ${MQTT_TOPIC_RIDE_STATUS:-ride/status}
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    restart: unless-stopped

  scheduler:
    build:
      context: .
      target: app
    container_name: bodaconnect-scheduler
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: bodaconnect
      DB_PASSWORD: secret
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
    entrypoint: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www/html
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: bodaconnect-frontend
    depends_on:
      app:
        condition: service_started
      scheduler:
        condition: service_started
      mqtt-broker:
        condition: service_started
    ports:
      - "3000:80"
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: bodaconnect-db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: bodaconnect
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: bodaconnect-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "status=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9200 || true); [ \"$$status\" = \"200\" ] || [ \"$$status\" = \"401\" ]"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: bodaconnect-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
    volumes:
      - ./monitoring/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "5601:5601"
    healthcheck:
      # Check /api/status (the real API endpoint) rather than the login page
      # so the healthy signal means Kibana is truly ready to accept API traffic.
      test: ["CMD-SHELL", "status=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5601/api/status || true); [ \"$$status\" = \"200\" ] || [ \"$$status\" = \"401\" ]"]
      interval: 15s
      timeout: 10s
      retries: 20
      # Kibana takes 60-120 s on first boot to initialise its index patterns.
      start_period: 120s
    restart: unless-stopped

  metricbeat:
    image: docker.elastic.co/beats/metricbeat:8.14.3
    container_name: bodaconnect-metricbeat
    user: root
    depends_on:
      app:
        condition: service_started
      scheduler:
        condition: service_started
      frontend:
        condition: service_started
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    command: ["--strict.perms=false"]
    environment:
      BODACONNECT_APP_CONTAINER_NAME: bodaconnect-app
      BODACONNECT_FRONTEND_CONTAINER_NAME: bodaconnect-frontend
      BODACONNECT_DB_CONTAINER_NAME: bodaconnect-db
      MYSQL_MONITORING_DSN: "root:rootsecret@tcp(db:3306)/"
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_USERNAME: elastic
      KIBANA_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - ./monitoring/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      - /:/hostfs:ro
    # on-failure so Docker restarts only if metricbeat crashes (exit != 0).
    # max_attempts caps the crash loop; once Kibana is up it will stay running.
    restart: on-failure:10

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: bodaconnect-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_logs:/mosquitto/log
    # Emit logs to stdout — view with: docker compose logs -f mqtt-broker
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

volumes:
  mysql_data:
  elasticsearch_data:
  mosquitto_logs:
