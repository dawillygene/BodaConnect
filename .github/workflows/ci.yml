name: BodaConnect CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  BACKEND_IMAGE: confidehub/bodaconnect-app
  FRONTEND_IMAGE: confidehub/bodaconnect-frontend

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo, pdo_mysql, pdo_sqlite, sqlite3, xml, curl, zip, gd
          coverage: none

      - name: Copy Laravel environment file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Run backend tests
        run: php artisan test --compact

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend Docker image for CI
        run: docker build --target app -t $BACKEND_IMAGE:ci .

      - name: Build frontend Docker image for CI
        run: docker build -t $FRONTEND_IMAGE:ci ./frontend

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:v1
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:v1
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    environment:
      name: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key for staging
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "${{ secrets.STAGING_SSH_KEY }}" | tr -d '\r' > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          touch ~/.ssh/known_hosts

          staging_host='${{ secrets.STAGING_HOST }}'
          staging_port='22'

          if [[ "${staging_host}" == *:* && "${staging_host}" != \[* ]]; then
            staging_port="${staging_host##*:}"
            staging_host="${staging_host%:*}"
          fi

          echo "STAGING_SSH_HOST=${staging_host}" >> "${GITHUB_ENV}"
          echo "STAGING_SSH_PORT=${staging_port}" >> "${GITHUB_ENV}"

          if ! ssh-keyscan -p "${staging_port}" -H "${staging_host}" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "Unable to fetch the SSH host key for staging (${staging_host}:${staging_port})."
            echo "Verify STAGING_HOST is correct and reachable from GitHub Actions."
            exit 1
          fi

      - name: Copy deployment files to staging server
        run: |
          ssh -p "${STAGING_SSH_PORT}" -i ~/.ssh/staging_key "${{ secrets.STAGING_USER }}@${STAGING_SSH_HOST}" "mkdir -p ~/bodaconnect/monitoring"
          scp -P "${STAGING_SSH_PORT}" -i ~/.ssh/staging_key docker-compose.deploy.yml "${{ secrets.STAGING_USER }}@${STAGING_SSH_HOST}:~/bodaconnect/docker-compose.deploy.yml"
          scp -P "${STAGING_SSH_PORT}" -i ~/.ssh/staging_key -r monitoring/* "${{ secrets.STAGING_USER }}@${STAGING_SSH_HOST}:~/bodaconnect/monitoring/" || true

      - name: Write staging environment file
        run: |
          ssh -p "${STAGING_SSH_PORT}" -i ~/.ssh/staging_key "${{ secrets.STAGING_USER }}@${STAGING_SSH_HOST}" "cat > ~/bodaconnect/.env" <<'EOF'
          ${{ secrets.STAGING_ENV_FILE }}
          EOF

      - name: Deploy application to staging
        run: |
          ssh -p "${STAGING_SSH_PORT}" -i ~/.ssh/staging_key "${{ secrets.STAGING_USER }}@${STAGING_SSH_HOST}" \
            "cd ~/bodaconnect \
            && export BACKEND_IMAGE='${{ env.BACKEND_IMAGE }}' \
            && export FRONTEND_IMAGE='${{ env.FRONTEND_IMAGE }}' \
            && export BACKEND_TAG='${{ github.sha }}' \
            && export FRONTEND_TAG='${{ github.sha }}' \
            && docker compose -f docker-compose.deploy.yml pull \
            && docker compose -f docker-compose.deploy.yml up -d \
            && docker compose -f docker-compose.deploy.yml exec -T app php artisan migrate --force \
            && docker image prune -f"

      - name: Verify staging deployment
        run: |
          sleep 30
          curl --fail --silent --show-error "http://ec2-16-171-25-187.eu-north-1.compute.amazonaws.com:8080/up" > /dev/null
          curl --fail --silent --show-error "http://ec2-16-171-25-187.eu-north-1.compute.amazonaws.com:3000/" > /dev/null

      - name: Collect staging Docker evidence
        run: |
          ssh -p "${STAGING_SSH_PORT}" -i ~/.ssh/staging_key "${{ secrets.STAGING_USER }}@${STAGING_SSH_HOST}" \
            "cd ~/bodaconnect \
            && echo '=== docker images ===' \
            && docker images | grep bodaconnect || true \
            && echo '=== docker ps ===' \
            && docker ps \
            && echo '=== docker stats ===' \
            && docker stats --no-stream \
            && echo '=== app logs ===' \
            && docker logs --tail=50 bodaconnect-app \
            && echo '=== frontend logs ===' \
            && docker logs --tail=50 bodaconnect-frontend \
            && echo '=== db logs ===' \
            && docker logs --tail=50 bodaconnect-db \
            && echo '=== elasticsearch logs ===' \
            && docker logs --tail=50 bodaconnect-elasticsearch \
            && echo '=== kibana logs ===' \
            && docker logs --tail=50 bodaconnect-kibana \
            && echo '=== metricbeat logs ===' \
            && docker logs --tail=50 bodaconnect-metricbeat"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push'
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key for production
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "${{ secrets.PRODUCTION_SSH_KEY }}" | tr -d '\r' > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          touch ~/.ssh/known_hosts

          production_host='${{ secrets.PRODUCTION_HOST }}'
          production_port='22'

          if [[ "${production_host}" == *:* && "${production_host}" != \[* ]]; then
            production_port="${production_host##*:}"
            production_host="${production_host%:*}"
          fi

          echo "PRODUCTION_SSH_HOST=${production_host}" >> "${GITHUB_ENV}"
          echo "PRODUCTION_SSH_PORT=${production_port}" >> "${GITHUB_ENV}"

          if ! ssh-keyscan -p "${production_port}" -H "${production_host}" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "Unable to fetch the SSH host key for production (${production_host}:${production_port})."
            echo "Verify PRODUCTION_HOST is correct and reachable from GitHub Actions."
            exit 1
          fi

      - name: Copy deployment files to production server
        run: |
          ssh -p "${PRODUCTION_SSH_PORT}" -i ~/.ssh/production_key "${{ secrets.PRODUCTION_USER }}@${PRODUCTION_SSH_HOST}" "mkdir -p ~/bodaconnect/monitoring"
          scp -P "${PRODUCTION_SSH_PORT}" -i ~/.ssh/production_key docker-compose.deploy.yml "${{ secrets.PRODUCTION_USER }}@${PRODUCTION_SSH_HOST}:~/bodaconnect/docker-compose.deploy.yml"
          scp -P "${PRODUCTION_SSH_PORT}" -i ~/.ssh/production_key -r monitoring/* "${{ secrets.PRODUCTION_USER }}@${PRODUCTION_SSH_HOST}:~/bodaconnect/monitoring/" || true

      - name: Write production environment file
        run: |
          ssh -p "${PRODUCTION_SSH_PORT}" -i ~/.ssh/production_key "${{ secrets.PRODUCTION_USER }}@${PRODUCTION_SSH_HOST}" "cat > ~/bodaconnect/.env" <<'EOF'
          ${{ secrets.PRODUCTION_ENV_FILE }}
          EOF

      - name: Deploy application to production
        run: |
          ssh -p "${PRODUCTION_SSH_PORT}" -i ~/.ssh/production_key "${{ secrets.PRODUCTION_USER }}@${PRODUCTION_SSH_HOST}" \
            "cd ~/bodaconnect \
            && export BACKEND_IMAGE='${{ env.BACKEND_IMAGE }}' \
            && export FRONTEND_IMAGE='${{ env.FRONTEND_IMAGE }}' \
            && export BACKEND_TAG='${{ github.sha }}' \
            && export FRONTEND_TAG='${{ github.sha }}' \
            && docker compose -f docker-compose.deploy.yml pull \
            && docker compose -f docker-compose.deploy.yml up -d \
            && docker compose -f docker-compose.deploy.yml exec -T app php artisan migrate --force \
            && docker image prune -f"

      - name: Verify production deployment
        run: |
          sleep 30
          curl --fail --silent --show-error "http://ec2-51-20-191-160.eu-north-1.compute.amazonaws.com:8080/up" > /dev/null
          curl --fail --silent --show-error "http://ec2-51-20-191-160.eu-north-1.compute.amazonaws.com:3000/" > /dev/null

      - name: Collect production Docker evidence
        run: |
          ssh -p "${PRODUCTION_SSH_PORT}" -i ~/.ssh/production_key "${{ secrets.PRODUCTION_USER }}@${PRODUCTION_SSH_HOST}" \
            "cd ~/bodaconnect \
            && echo '=== docker images ===' \
            && docker images | grep bodaconnect || true \
            && echo '=== docker ps ===' \
            && docker ps \
            && echo '=== docker stats ===' \
            && docker stats --no-stream \
            && echo '=== app logs ===' \
            && docker logs --tail=50 bodaconnect-app \
            && echo '=== frontend logs ===' \
            && docker logs --tail=50 bodaconnect-frontend \
            && echo '=== db logs ===' \
            && docker logs --tail=50 bodaconnect-db \
            && echo '=== elasticsearch logs ===' \
            && docker logs --tail=50 bodaconnect-elasticsearch \
            && echo '=== kibana logs ===' \
            && docker logs --tail=50 bodaconnect-kibana \
            && echo '=== metricbeat logs ===' \
            && docker logs --tail=50 bodaconnect-metricbeat"
