name: BodaConnect CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  BACKEND_IMAGE: confidehub/bodaconnect-app
  FRONTEND_IMAGE: confidehub/bodaconnect-frontend

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo, pdo_mysql, pdo_sqlite, sqlite3, xml, curl, zip, gd
          coverage: none

      - name: Copy Laravel environment file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Run backend tests
        run: php artisan test --compact

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend Docker image for CI
        run: docker build --target app -t $BACKEND_IMAGE:ci .

      - name: Build frontend Docker image for CI
        run: docker build -t $FRONTEND_IMAGE:ci ./frontend

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:v${{ github.run_number }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:v${{ github.run_number }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    environment:
      name: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key for staging
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy deployment files to staging server
        run: |
          ssh -i ~/.ssh/staging_key "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" "mkdir -p ~/bodaconnect/monitoring"
          scp -i ~/.ssh/staging_key docker-compose.deploy.yml "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:~/bodaconnect/docker-compose.deploy.yml"
          scp -i ~/.ssh/staging_key -r monitoring/* "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:~/bodaconnect/monitoring/" || true

      - name: Write staging environment file
        run: |
          ssh -i ~/.ssh/staging_key "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" "cat > ~/bodaconnect/.env" <<'EOF'
          ${{ secrets.STAGING_ENV_FILE }}
          EOF

      - name: Deploy application to staging
        run: |
          ssh -i ~/.ssh/staging_key "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" \
            "cd ~/bodaconnect \
            && export BACKEND_IMAGE='${{ env.BACKEND_IMAGE }}' \
            && export FRONTEND_IMAGE='${{ env.FRONTEND_IMAGE }}' \
            && export BACKEND_TAG='${{ github.sha }}' \
            && export FRONTEND_TAG='${{ github.sha }}' \
            && docker compose -f docker-compose.deploy.yml pull \
            && docker compose -f docker-compose.deploy.yml up -d \
            && docker compose -f docker-compose.deploy.yml exec -T app php artisan migrate --force \
            && docker image prune -f"

      - name: Verify staging deployment
        run: |
          sleep 30
          curl --fail --silent --show-error "http://ec2-16-171-25-187.eu-north-1.compute.amazonaws.com:8080/up" > /dev/null
          curl --fail --silent --show-error "http://ec2-16-171-25-187.eu-north-1.compute.amazonaws.com:3000/" > /dev/null

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push'
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key for production
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          ssh-keyscan -H "${{ secrets.PRODUCTION_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy deployment files to production server
        run: |
          ssh -i ~/.ssh/production_key "${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}" "mkdir -p ~/bodaconnect/monitoring"
          scp -i ~/.ssh/production_key docker-compose.deploy.yml "${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:~/bodaconnect/docker-compose.deploy.yml"
          scp -i ~/.ssh/production_key -r monitoring/* "${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:~/bodaconnect/monitoring/" || true

      - name: Write production environment file
        run: |
          ssh -i ~/.ssh/production_key "${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}" "cat > ~/bodaconnect/.env" <<'EOF'
          ${{ secrets.PRODUCTION_ENV_FILE }}
          EOF

      - name: Deploy application to production
        run: |
          ssh -i ~/.ssh/production_key "${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}" \
            "cd ~/bodaconnect \
            && export BACKEND_IMAGE='${{ env.BACKEND_IMAGE }}' \
            && export FRONTEND_IMAGE='${{ env.FRONTEND_IMAGE }}' \
            && export BACKEND_TAG='${{ github.sha }}' \
            && export FRONTEND_TAG='${{ github.sha }}' \
            && docker compose -f docker-compose.deploy.yml pull \
            && docker compose -f docker-compose.deploy.yml up -d \
            && docker compose -f docker-compose.deploy.yml exec -T app php artisan migrate --force \
            && docker image prune -f"

      - name: Verify production deployment
        run: |
          sleep 30
          curl --fail --silent --show-error "http://ec2-51-20-191-160.eu-north-1.compute.amazonaws.com:8080/up" > /dev/null
          curl --fail --silent --show-error "http://ec2-51-20-191-160.eu-north-1.compute.amazonaws.com:3000/" > /dev/null
