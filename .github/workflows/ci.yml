name: 1. Code Push - BodaConnect CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  BACKEND_IMAGE: confidehub/bodaconnect-app
  FRONTEND_IMAGE: confidehub/bodaconnect-frontend

jobs:
  build-application:
    name: 2. Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo, pdo_mysql, pdo_sqlite, sqlite3, xml, curl, zip, gd
          coverage: pcov

      - name: Copy Laravel environment file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend application
        working-directory: frontend
        run: npm run build

  run-tests:
    name: 3. Run Tests
    runs-on: ubuntu-latest
    needs: build-application

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo, pdo_mysql, pdo_sqlite, sqlite3, xml, curl, zip, gd
          coverage: none

      - name: Copy Laravel environment file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Run backend tests with coverage
        run: |
          mkdir -p coverage
          ./vendor/bin/phpunit \
            --log-junit coverage/junit.xml \
            --coverage-clover coverage/clover.xml \
            --coverage-html coverage/html \
            --coverage-text=coverage/summary.txt \
            --only-summary-for-coverage-text

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '## PHPUnit Coverage Summary'
            echo
            if [ -f coverage/summary.txt ]; then
              cat coverage/summary.txt
            else
              echo 'Coverage summary was not generated.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-coverage-${{ github.run_number }}
          path: coverage
          if-no-files-found: error

  build-docker-image:
    name: 4. Build Docker Image
    runs-on: ubuntu-latest
    needs: run-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image for CI
        run: docker build --target app -t $BACKEND_IMAGE:ci .

      - name: Build frontend Docker image for CI
        run: docker build -t $FRONTEND_IMAGE:ci ./frontend

  push-to-docker-hub:
    name: 5. Push to Docker Hub (Third-party)
    runs-on: ubuntu-latest
    needs: build-docker-image
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker image tags
        id: docker_tags
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="v1.0.${GITHUB_RUN_NUMBER}"
          fi

          major_minor_tag="$(printf '%s\n' "${release_tag}" | sed -E 's/^(v[0-9]+\.[0-9]+).*/\1/')"

          {
            echo "release_tag=${release_tag}"
            echo "major_minor_tag=${major_minor_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.docker_tags.outputs.major_minor_tag }}
            ${{ env.BACKEND_IMAGE }}:${{ steps.docker_tags.outputs.release_tag }}
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.docker_tags.outputs.major_minor_tag }}
            ${{ env.FRONTEND_IMAGE }}:${{ steps.docker_tags.outputs.release_tag }}
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy-staging:
    name: 6. Deploy to Server / Cloud (Staging)
    runs-on: ubuntu-latest
    needs: push-to-docker-hub
    if: github.event_name == 'push'
    environment:
      name: staging
    env:
      DEPLOY_DIRECTORY: ~/apps/bodaconnect/staging
      DEPLOY_PROJECT_NAME: bodaconnect-staging
      DEPLOY_VOLUME_PREFIX: bodaconnect-staging
      DEPLOY_APP_PORT: 8081
      DEPLOY_FRONTEND_PORT: 3001
      DEPLOY_KIBANA_PORT: 5602

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key for staging
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "${{ secrets.STAGING_SSH_KEY }}" | tr -d '\r' > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          touch ~/.ssh/known_hosts

          staging_host='${{ secrets.STAGING_HOST }}'
          staging_port='22'

          if [[ "${staging_host}" == *:* && "${staging_host}" != \[* ]]; then
            staging_port="${staging_host##*:}"
            staging_host="${staging_host%:*}"
          fi

          echo "STAGING_SSH_HOST=${staging_host}" >> "${GITHUB_ENV}"
          echo "STAGING_SSH_PORT=${staging_port}" >> "${GITHUB_ENV}"

          if ! ssh-keyscan -p "${staging_port}" -H "${staging_host}" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "Unable to fetch the SSH host key for staging (${staging_host}:${staging_port})."
            echo "Verify STAGING_HOST is correct and reachable from GitHub Actions."
            exit 1
          fi

      - name: Copy deployment files to staging server
        run: |
          ssh -p "${STAGING_SSH_PORT}" -i ~/.ssh/staging_key "${{ secrets.STAGING_USER }}@${STAGING_SSH_HOST}" "mkdir -p ${DEPLOY_DIRECTORY}/monitoring"
          scp -P "${STAGING_SSH_PORT}" -i ~/.ssh/staging_key docker-compose.deploy.yml "${{ secrets.STAGING_USER }}@${STAGING_SSH_HOST}:${DEPLOY_DIRECTORY}/docker-compose.deploy.yml"
          scp -P "${STAGING_SSH_PORT}" -i ~/.ssh/staging_key mosquitto.conf "${{ secrets.STAGING_USER }}@${STAGING_SSH_HOST}:${DEPLOY_DIRECTORY}/mosquitto.conf"
          scp -P "${STAGING_SSH_PORT}" -i ~/.ssh/staging_key -r monitoring/* "${{ secrets.STAGING_USER }}@${STAGING_SSH_HOST}:${DEPLOY_DIRECTORY}/monitoring/" || true

      - name: Write staging environment file
        run: |
          ssh -p "${STAGING_SSH_PORT}" -i ~/.ssh/staging_key "${{ secrets.STAGING_USER }}@${STAGING_SSH_HOST}" "cat > ${DEPLOY_DIRECTORY}/.env" <<'EOF'
          ${{ secrets.STAGING_ENV_FILE }}
          EOF

      - name: Deploy application to staging
        run: |
          ssh -p "${STAGING_SSH_PORT}" -i ~/.ssh/staging_key "${{ secrets.STAGING_USER }}@${STAGING_SSH_HOST}" \
            "cd ${DEPLOY_DIRECTORY} \
            && mysql_volume='' \
            && for candidate in '${DEPLOY_PROJECT_NAME}_mysql_data' 'bodaconnect_mysql_data' '${DEPLOY_VOLUME_PREFIX}-mysql-data'; do \
              if docker volume inspect \"\$candidate\" >/dev/null 2>&1; then mysql_volume=\"\$candidate\"; break; fi; \
            done \
            && if [ -z \"\$mysql_volume\" ]; then mysql_volume='${DEPLOY_VOLUME_PREFIX}-mysql-data'; fi \
            && elasticsearch_volume='' \
            && for candidate in '${DEPLOY_PROJECT_NAME}_elasticsearch_data' 'bodaconnect_elasticsearch_data' '${DEPLOY_VOLUME_PREFIX}-elasticsearch-data'; do \
              if docker volume inspect \"\$candidate\" >/dev/null 2>&1; then elasticsearch_volume=\"\$candidate\"; break; fi; \
            done \
            && if [ -z \"\$elasticsearch_volume\" ]; then elasticsearch_volume='${DEPLOY_VOLUME_PREFIX}-elasticsearch-data'; fi \
            && export COMPOSE_PROJECT_NAME='${DEPLOY_PROJECT_NAME}' \
            && export DATA_VOLUME_PREFIX='${DEPLOY_VOLUME_PREFIX}' \
            && export MYSQL_DATA_VOLUME=\"\$mysql_volume\" \
            && export ELASTICSEARCH_DATA_VOLUME=\"\$elasticsearch_volume\" \
            && export APP_PORT='${DEPLOY_APP_PORT}' \
            && export FRONTEND_PORT='${DEPLOY_FRONTEND_PORT}' \
            && export KIBANA_PORT='${DEPLOY_KIBANA_PORT}' \
            && export BACKEND_IMAGE='${{ env.BACKEND_IMAGE }}' \
            && export FRONTEND_IMAGE='${{ env.FRONTEND_IMAGE }}' \
            && export BACKEND_TAG='${{ github.sha }}' \
            && export FRONTEND_TAG='${{ github.sha }}' \
            && echo \"Using MySQL volume: \$MYSQL_DATA_VOLUME\" \
            && echo \"Using Elasticsearch volume: \$ELASTICSEARCH_DATA_VOLUME\" \
            && docker compose -f docker-compose.deploy.yml pull \
            && docker compose -f docker-compose.deploy.yml up -d \
            && docker compose -f docker-compose.deploy.yml exec -T app php artisan migrate --force \
            && docker image prune -f"

      - name: Verify staging deployment
        run: |
          sleep 30
          ssh -p "${STAGING_SSH_PORT}" -i ~/.ssh/staging_key "${{ secrets.STAGING_USER }}@${STAGING_SSH_HOST}" \
            "cd ${DEPLOY_DIRECTORY} \
            && curl --fail --silent --show-error http://127.0.0.1:${DEPLOY_APP_PORT}/up > /dev/null \
            && curl --fail --silent --show-error http://127.0.0.1:${DEPLOY_FRONTEND_PORT}/ > /dev/null"

      - name: Diagnose staging deployment failure
        if: failure()
        run: |
          ssh -p "${STAGING_SSH_PORT}" -i ~/.ssh/staging_key "${{ secrets.STAGING_USER }}@${STAGING_SSH_HOST}" \
            "cd ${DEPLOY_DIRECTORY} \
            && export COMPOSE_PROJECT_NAME='${DEPLOY_PROJECT_NAME}' \
            && echo '=== docker compose ps ===' \
            && docker compose -f docker-compose.deploy.yml ps \
            && echo '=== app logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=100 app \
            && echo '=== frontend logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=100 frontend \
            && echo '=== scheduler logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=100 scheduler \
            && echo '=== db logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=100 db"

      - name: Collect staging Docker evidence
        run: |
          ssh -p "${STAGING_SSH_PORT}" -i ~/.ssh/staging_key "${{ secrets.STAGING_USER }}@${STAGING_SSH_HOST}" \
            "cd ${DEPLOY_DIRECTORY} \
            && export COMPOSE_PROJECT_NAME='${DEPLOY_PROJECT_NAME}' \
            && echo '=== docker images ===' \
            && docker images | grep bodaconnect || true \
            && echo '=== docker ps ===' \
            && docker compose -f docker-compose.deploy.yml ps \
            && echo '=== docker stats ===' \
            && docker stats --no-stream \
            && echo '=== app logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=50 app \
            && echo '=== frontend logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=50 frontend \
            && echo '=== db logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=50 db \
            && echo '=== elasticsearch logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=50 elasticsearch \
            && echo '=== kibana logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=50 kibana \
            && echo '=== metricbeat logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=50 metricbeat"

  deploy-production:
    name: 6b. Deploy to Server / Cloud (Production)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push'
    environment:
      name: production
    env:
      DEPLOY_DIRECTORY: ~/apps/bodaconnect/production
      DEPLOY_PROJECT_NAME: bodaconnect-production
      DEPLOY_VOLUME_PREFIX: bodaconnect-production
      DEPLOY_APP_PORT: 8080
      DEPLOY_FRONTEND_PORT: 3000
      DEPLOY_KIBANA_PORT: 5601

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key for production
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "${{ secrets.PRODUCTION_SSH_KEY }}" | tr -d '\r' > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          touch ~/.ssh/known_hosts

          production_host='${{ secrets.PRODUCTION_HOST }}'
          production_port='22'

          if [[ "${production_host}" == *:* && "${production_host}" != \[* ]]; then
            production_port="${production_host##*:}"
            production_host="${production_host%:*}"
          fi

          echo "PRODUCTION_SSH_HOST=${production_host}" >> "${GITHUB_ENV}"
          echo "PRODUCTION_SSH_PORT=${production_port}" >> "${GITHUB_ENV}"

          if ! ssh-keyscan -p "${production_port}" -H "${production_host}" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "Unable to fetch the SSH host key for production (${production_host}:${production_port})."
            echo "Verify PRODUCTION_HOST is correct and reachable from GitHub Actions."
            exit 1
          fi

      - name: Copy deployment files to production server
        run: |
          ssh -p "${PRODUCTION_SSH_PORT}" -i ~/.ssh/production_key "${{ secrets.PRODUCTION_USER }}@${PRODUCTION_SSH_HOST}" "mkdir -p ${DEPLOY_DIRECTORY}/monitoring"
          scp -P "${PRODUCTION_SSH_PORT}" -i ~/.ssh/production_key docker-compose.deploy.yml "${{ secrets.PRODUCTION_USER }}@${PRODUCTION_SSH_HOST}:${DEPLOY_DIRECTORY}/docker-compose.deploy.yml"
          scp -P "${PRODUCTION_SSH_PORT}" -i ~/.ssh/production_key mosquitto.conf "${{ secrets.PRODUCTION_USER }}@${PRODUCTION_SSH_HOST}:${DEPLOY_DIRECTORY}/mosquitto.conf"
          scp -P "${PRODUCTION_SSH_PORT}" -i ~/.ssh/production_key -r monitoring/* "${{ secrets.PRODUCTION_USER }}@${PRODUCTION_SSH_HOST}:${DEPLOY_DIRECTORY}/monitoring/" || true

      - name: Write production environment file
        run: |
          ssh -p "${PRODUCTION_SSH_PORT}" -i ~/.ssh/production_key "${{ secrets.PRODUCTION_USER }}@${PRODUCTION_SSH_HOST}" "cat > ${DEPLOY_DIRECTORY}/.env" <<'EOF'
          ${{ secrets.PRODUCTION_ENV_FILE }}
          EOF

      - name: Deploy application to production
        run: |
          ssh -p "${PRODUCTION_SSH_PORT}" -i ~/.ssh/production_key "${{ secrets.PRODUCTION_USER }}@${PRODUCTION_SSH_HOST}" \
            "cd ${DEPLOY_DIRECTORY} \
            && mysql_volume='' \
            && for candidate in '${DEPLOY_PROJECT_NAME}_mysql_data' 'bodaconnect_mysql_data' '${DEPLOY_VOLUME_PREFIX}-mysql-data'; do \
              if docker volume inspect \"\$candidate\" >/dev/null 2>&1; then mysql_volume=\"\$candidate\"; break; fi; \
            done \
            && if [ -z \"\$mysql_volume\" ]; then mysql_volume='${DEPLOY_VOLUME_PREFIX}-mysql-data'; fi \
            && elasticsearch_volume='' \
            && for candidate in '${DEPLOY_PROJECT_NAME}_elasticsearch_data' 'bodaconnect_elasticsearch_data' '${DEPLOY_VOLUME_PREFIX}-elasticsearch-data'; do \
              if docker volume inspect \"\$candidate\" >/dev/null 2>&1; then elasticsearch_volume=\"\$candidate\"; break; fi; \
            done \
            && if [ -z \"\$elasticsearch_volume\" ]; then elasticsearch_volume='${DEPLOY_VOLUME_PREFIX}-elasticsearch-data'; fi \
            && export COMPOSE_PROJECT_NAME='${DEPLOY_PROJECT_NAME}' \
            && export DATA_VOLUME_PREFIX='${DEPLOY_VOLUME_PREFIX}' \
            && export MYSQL_DATA_VOLUME=\"\$mysql_volume\" \
            && export ELASTICSEARCH_DATA_VOLUME=\"\$elasticsearch_volume\" \
            && export APP_PORT='${DEPLOY_APP_PORT}' \
            && export FRONTEND_PORT='${DEPLOY_FRONTEND_PORT}' \
            && export KIBANA_PORT='${DEPLOY_KIBANA_PORT}' \
            && export BACKEND_IMAGE='${{ env.BACKEND_IMAGE }}' \
            && export FRONTEND_IMAGE='${{ env.FRONTEND_IMAGE }}' \
            && export BACKEND_TAG='${{ github.sha }}' \
            && export FRONTEND_TAG='${{ github.sha }}' \
            && echo \"Using MySQL volume: \$MYSQL_DATA_VOLUME\" \
            && echo \"Using Elasticsearch volume: \$ELASTICSEARCH_DATA_VOLUME\" \
            && docker compose -f docker-compose.deploy.yml pull \
            && docker compose -f docker-compose.deploy.yml up -d \
            && docker compose -f docker-compose.deploy.yml exec -T app php artisan migrate --force \
            && docker image prune -f"

      - name: Verify production deployment
        run: |
          sleep 30
          ssh -p "${PRODUCTION_SSH_PORT}" -i ~/.ssh/production_key "${{ secrets.PRODUCTION_USER }}@${PRODUCTION_SSH_HOST}" \
            "cd ${DEPLOY_DIRECTORY} \
            && curl --fail --silent --show-error http://127.0.0.1:${DEPLOY_APP_PORT}/up > /dev/null \
            && curl --fail --silent --show-error http://127.0.0.1:${DEPLOY_FRONTEND_PORT}/ > /dev/null"

      - name: Diagnose production deployment failure
        if: failure()
        run: |
          ssh -p "${PRODUCTION_SSH_PORT}" -i ~/.ssh/production_key "${{ secrets.PRODUCTION_USER }}@${PRODUCTION_SSH_HOST}" \
            "cd ${DEPLOY_DIRECTORY} \
            && export COMPOSE_PROJECT_NAME='${DEPLOY_PROJECT_NAME}' \
            && echo '=== docker compose ps ===' \
            && docker compose -f docker-compose.deploy.yml ps \
            && echo '=== app logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=100 app \
            && echo '=== frontend logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=100 frontend \
            && echo '=== scheduler logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=100 scheduler \
            && echo '=== db logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=100 db"

      - name: Collect production Docker evidence
        run: |
          ssh -p "${PRODUCTION_SSH_PORT}" -i ~/.ssh/production_key "${{ secrets.PRODUCTION_USER }}@${PRODUCTION_SSH_HOST}" \
            "cd ${DEPLOY_DIRECTORY} \
            && export COMPOSE_PROJECT_NAME='${DEPLOY_PROJECT_NAME}' \
            && echo '=== docker images ===' \
            && docker images | grep bodaconnect || true \
            && echo '=== docker ps ===' \
            && docker compose -f docker-compose.deploy.yml ps \
            && echo '=== docker stats ===' \
            && docker stats --no-stream \
            && echo '=== app logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=50 app \
            && echo '=== frontend logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=50 frontend \
            && echo '=== db logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=50 db \
            && echo '=== elasticsearch logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=50 elasticsearch \
            && echo '=== kibana logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=50 kibana \
            && echo '=== metricbeat logs ===' \
            && docker compose -f docker-compose.deploy.yml logs --tail=50 metricbeat"

  run-mqtt-enabled-application:
    name: 7. Run MQTT-enabled Application
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.event_name == 'push'
    env:
      DEPLOY_DIRECTORY: ~/apps/bodaconnect/production
      DEPLOY_PROJECT_NAME: bodaconnect-production
      DEPLOY_APP_PORT: 8080
      DEPLOY_FRONTEND_PORT: 3000

    steps:
      - name: Prepare SSH key for production MQTT verification
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "${{ secrets.PRODUCTION_SSH_KEY }}" | tr -d '\r' > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          touch ~/.ssh/known_hosts

          production_host='${{ secrets.PRODUCTION_HOST }}'
          production_port='22'

          if [[ "${production_host}" == *:* && "${production_host}" != \[* ]]; then
            production_port="${production_host##*:}"
            production_host="${production_host%:*}"
          fi

          echo "PRODUCTION_SSH_HOST=${production_host}" >> "${GITHUB_ENV}"
          echo "PRODUCTION_SSH_PORT=${production_port}" >> "${GITHUB_ENV}"

          if ! ssh-keyscan -p "${production_port}" -H "${production_host}" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "Unable to fetch the SSH host key for production (${production_host}:${production_port})."
            echo "Verify PRODUCTION_HOST is correct and reachable from GitHub Actions."
            exit 1
          fi

      - name: Verify MQTT-enabled containers are running
        run: |
          ssh -p "${PRODUCTION_SSH_PORT}" -i ~/.ssh/production_key "${{ secrets.PRODUCTION_USER }}@${PRODUCTION_SSH_HOST}" \
            "cd ${DEPLOY_DIRECTORY} \
            && export COMPOSE_PROJECT_NAME='${DEPLOY_PROJECT_NAME}' \
            && test \"\$(docker compose -f docker-compose.deploy.yml ps --services --status running | grep -Ec '^(app|frontend|mqtt-broker)$')\" -eq 3"

      - name: Verify deployed application endpoints remain reachable
        run: |
          ssh -p "${PRODUCTION_SSH_PORT}" -i ~/.ssh/production_key "${{ secrets.PRODUCTION_USER }}@${PRODUCTION_SSH_HOST}" \
            "cd ${DEPLOY_DIRECTORY} \
            && curl --fail --silent --show-error http://127.0.0.1:${DEPLOY_APP_PORT}/up > /dev/null \
            && curl --fail --silent --show-error http://127.0.0.1:${DEPLOY_FRONTEND_PORT}/ > /dev/null"
